<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>ドパファミチェッカーフォーム</title>
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="favicon.png">
    </head>
    <body>
        <h1>ドパファミチェッカーフォーム</h1>
        <p>家族がスマホに夢中で、時間を奪われないようにします!</p>
        <h2>フォーム</h2>
        <form id="form">
            <label>あなたはスマホに夢中で睡眠時間が奪われることがありますか?
                <select name="Q1">
                    <option value="0">はい</option>
                    <option value="2" selected>いいえ</option>
                    <option value="1">たまに</option>
                </select>
            </label><br>
            <label>あなたはスマホを一日何時間見ますか?
                <select name="Q2">
                    <option value="7">0時間</option>
                    <option value="6">0から1.5時間</option>
                    <option value="5">1.5から2時間</option>
                    <option value="4" selected>2から3時間</option>
                    <option value="3">3から5時間</option>
                    <option value="2">5から7.5時間</option>
                    <option value="1">7.5から9時間</option>
                    <option value="0">9時間以上</option>
                </select>
            </label><br>
            <label>あなたはスマホを主に何に利用しますか?
                <select name="Q3">
                    <option value="4">天気やニュースの確認、情報の取得</option>
                    <option value="4">勉強!!!!!</option>
                    <option value="3" selected>ゲーム</option>
                    <option value="2">横動画</option>
                    <option value="1">SNS</option>
                    <option value="0">ショート動画</option>
                </select>
            </label><br>
            <label>あなたはスマホを5分だけ見ると決めたのに、実際は1時間立つなどの現象は起きますか?
                <select name="Q4">
                    <option value="0">はい</option>
                    <option value="2" selected>いいえ</option>
                    <option value="1">たまに</option>
                </select>
            </label><br>
            <label>あなたはスマホのせいで会社や学校に遅れることがありますか?
                <select name="Q5">
                    <option value="0">はい</option>
                    <option value="2" selected>いいえ</option>
                    <option value="1">たまに</option>
                </select>
            </label><br>
            <label>あなたは食事中スマホを見ながら食事をしていますか?
                <select name="Q6">
                    <option value="0">はい</option>
                    <option value="2" selected>いいえ</option>
                    <option value="1">たまに</option>
                </select>
            </label><br>
            <label>あなたはトイレ中スマホを見ながらトイレをしていますか?
                <select name="Q7">
                    <option value="0">はい</option>
                    <option value="2" selected>いいえ</option>
                    <option value="1">たまに</option>
                </select>
            </label><br>
            <label>あなたは飽きっぽいですか?
                <select name="Q8">
                    <option value="0">はい</option>
                    <option value="2" selected>いいえ</option>
                    <option value="1">どちらともいえない!!!!!!!!!!!!!!!</option>
                </select>
            </label><br>
            <label>SNSで気になる投稿があると、すぐに開いてしまいますか?
                <select name="Q9">
                    <option value="0">はい</option>
                    <option value="2" selected>いいえ</option>
                    <option value="1">どちらともいえない!!!!!!!!!!!!!!!</option>
                </select>
            </label><br>
            <label>SNSや動画のせいで声をかけるとつい怒ってしまいますか?
                <select name="Q10">
                    <option value="0">はい</option>
                    <option value="2" selected>いいえ</option>
                    <option value="1">どちらともいえない!!!!!!!!!!!!!!!</option>
                </select>
            </label><br>
            <label>あなたは作業中スマホを使える環境だとつい使ってしまいますか?
                <select name="Q11">
                    <option value="0">はい</option>
                    <option value="2" selected>いいえ</option>
                    <option value="1">どちらともいえない!!!!!!!!!!!!!!!</option>
                </select>
            </label><br>
            <label>ショート動画の平均スクロール時間（広告含む）
                <select name="Q12">
                    <option value="9">5秒</option>
                    <option value="4">10秒</option>
                    <option value="0">15秒</option>
                    <option value="1">20秒</option>
                    <option value="2">25秒</option>
                    <option value="3">30秒</option>
                    <option value="4">35秒</option>
                    <option value="5">40秒</option>
                    <option value="6">45秒</option>
                    <option value="7">50秒</option>
                    <option value="8">55秒</option>
                    <option value="9" selected>終わるまで</option>
                </select>
            </label><br>
            <label>流行りのミームに対しての反応
                <select name="Q13">
                    <option value="0">すぐに覚えて、ミームを再現した行動をしてしまう</option>
                    <option value="1">少し覚えてて、たまに再現した行動をする</option>
                    <option value="2">あまり覚えない。</option>
                    <option value="3" selected>無視虫!!!</option>
                </select>
            </label><br>
            <label>67という数字をどう思いますか?
                <select name="Q14">
                    <option value="0">67（シックスセブン）!!!!!!!!!!</option>
                    <option value="3">70から3を引いた数</option>
                    <option value="1">ブレインロッドの1つ</option>
                    <option value="2" selected>流行り</option>
                </select>
            </label><br>
            <button type="submit">これで結果を調べる</button>
        </form>
        <h2>結果</h2>
        <output>まずは、フォームをクリアしてください</output>
        <div id="outputQR"></div>
        <button id="export" hidden>エクスポート</button>
        <footer>
            <p>QRコードはデンソーウェーブ株式会社の商標登録です。</p>
        </footer>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <script>
            const form = document.getElementById("form");
            const output = document.querySelector("output")
            const outputQR = document.getElementById("outputQR")
            const exportfile = document.getElementById("export")

            function toBase64(str) {
                const bytes = new TextEncoder().encode(str);
                let binary = "";

                for (const byte of bytes) {
                    binary += String.fromCharCode(byte);
                }

                return btoa(binary);
            }

            form.addEventListener("submit", (event) => {
                event.preventDefault();
                const Questions = 14
                const Score = (parseInt(form.Q1.value) / 2 * 100 / Questions) + 
                (parseInt(form.Q2.value) / 7 * 100 / Questions) + 
                (parseInt(form.Q3.value) / 4 * 100 / Questions) +
                (parseInt(form.Q4.value) / 2 * 100 / Questions) +
                (parseInt(form.Q5.value) / 2 * 100 / Questions) +
                (parseInt(form.Q6.value) / 2 * 100 / Questions) +
                (parseInt(form.Q7.value) / 2 * 100 / Questions) +
                (parseInt(form.Q8.value) / 2 * 100 / Questions) +
                (parseInt(form.Q9.value) / 2 * 100 / Questions) +
                (parseInt(form.Q10.value) / 2 * 100 / Questions) +
                (parseInt(form.Q11.value) / 2 * 100 / Questions) +
                (parseInt(form.Q12.value) / 9 * 100 / Questions) +
                (parseInt(form.Q13.value) / 3 * 100 / Questions) +
                (parseInt(form.Q14.value) / 3 * 100 / Questions)
                let Level
                if(Score * 1.2 > 100)
                {
                    Level = "大丈夫"
                }
                else if(Score * 1.2 > 80)
                {
                    Level = "基本大丈夫"
                }
                else if(Score * 1.2 > 60)
                {
                    Level = "ほんの少し中毒"
                }
                else if(Score * 1.2 > 40)
                {
                    Level = "軽度のドーパミン中毒"
                }
                else if(Score * 1.2 > 20)
                {
                    Level = "中程度のドーパミン中毒"
                }
                else
                {
                    Level = "重度のドーパミン中毒"
                }

                output.innerHTML = `スコア: ${Score.toFixed(2)}<br>レベル: ${Level}<br>下の文字列をホームの追加欄に貼り付けてください。回答者の記入も忘れずに<br>${toBase64(JSON.stringify({score:Score.toFixed(2), level:Level}))}<br>QRコード`
                outputQR.replaceChildren()
                const qrcode = new QRCode(
                    outputQR,
                    {
                        text: toBase64(JSON.stringify({score:Score.toFixed(2), level:Level})),
                        width: 256,
                        height: 256,
                        correctLevel: QRCode.CorrectLevel.H
                    }
                );
                exportfile.hidden = false
                exportfile.addEventListener("click", ()=>{
                    const canvas = document.querySelector("#outputQR canvas");

                    if (canvas) {
                        const link = document.createElement("a");
                        link.href = canvas.toDataURL("image/png");
                        link.download = "QRCode.png";
                        link.click();
                    }
                })
            });
        </script>
    </body>
</html>
